<!-- ===================== ТЁМНАЯ ТЕМА: вставить в <head> ===================== -->
<!-- Ставить как можно выше в <head>, ДО основных стилей сайта.
     Этот маленький скрипт сразу включает тёмную тему, если пользователь выбрал её раньше.
     Без него страница сначала мелькнёт светлой, а потом станет тёмной. -->
<script>
  try {
    if (localStorage.getItem('sinay-theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  } catch (e) { /* localStorage недоступен (приватный режим) — просто светлая тема */ }
</script>
<!-- Стили тёмной темы и кнопки. Пока на <html> нет data-theme="dark", они ничего не меняют. -->
<link rel="stylesheet" href="/theme-toggle/theme-dark.css">
<!-- ========================================================================== -->
