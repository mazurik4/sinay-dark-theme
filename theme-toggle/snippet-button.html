<!-- ============ КНОПКА СМЕНЫ ТЕМЫ: вставить в шапку ============
     ВАЖНО: вставлять в ОБЩИЙ шаблон шапки, который используется и для RU, и для UA версии,
     иначе при смене языка кнопка пропадёт. Подписи кнопки скрипт сам ставит на языке страницы.
     Место: внутри <div class="header_right_wrap">, сразу ПЕРЕД блоком
     <div class="languages"> (RU/UA) — то есть между кнопкой телефона и языком.
     (На мобильном между ними ещё кнопка каталога — ставить всё равно перед .languages.)
     Атрибут data-theme-toggle обязателен — по нему кнопку находит скрипт.
     Луна видна в светлой теме, солнце — в тёмной (переключает CSS). -->
<button type="button" class="theme_toggle" data-theme-toggle
        aria-pressed="false" aria-label="Включить тёмную тему" title="Тёмная тема">
  <!-- луна -->
  <svg class="theme_toggle__moon" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5a8.5 8.5 0 1 0 10.8 10.8Z"
          stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
  </svg>
  <!-- солнце -->
  <svg class="theme_toggle__sun" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <circle cx="12" cy="12" r="4.25" stroke="currentColor" stroke-width="1.5"/>
    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
</button>
<!-- ============================================================= -->
